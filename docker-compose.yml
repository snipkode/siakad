services:
  db:
    image: mysql:8.0
    container_name: siakad-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pis_akademik
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./pis_akademik.sql:/docker-entrypoint-initdb.d/01-pis_akademik.sql
      - ./database/meta_schema.sql:/docker-entrypoint-initdb.d/02-meta_schema.sql
      - ./database/meta_alter.sql:/docker-entrypoint-initdb.d/03-meta_alter.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: .
    container_name: siakad-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html

volumes:
  db_data: